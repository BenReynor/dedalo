name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly (Monday 06:00 UTC): detects that a dependency update or a change
  # in the Linux/Windows runner images broke the suite, even if nobody
  # pushes. A failure here raises an alert on GitHub.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tests make REAL git commits/reverts: without a global identity,
      # `git commit` fails and the revert/initialize_git tests break.
      - name: Git identity
        run: |
          git config --global user.name "dedalo CI"
          git config --global user.email "ci@dedalo.local"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      # Qt in offscreen mode: no screen, but it needs these native libs.
      - name: System dependencies (headless Qt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check dedalo/ tests/

      - name: Tests (headless pytest)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: 1
        run: python -m pytest tests/

  # Windows: the GUI must start and the full suite must pass with the
  # POSIX tests skipped (test_portabilidad, signals, 0600...). The loop and
  # the gate are already native Python engines (test_lanzador starts `python -m
  # …loop` from another cwd, just like the GUI); Git Bash is put on the PATH
  # for the tests that still use the bash engine/templates (test_dedalo_senales,
  # test_e2e_con_trabajo, test_gate_backend...).
  test-windows:
    name: ruff + pytest (Windows)
    runs-on: windows-latest
    env:
      # Windows writes tempfiles in cp1252 by default and the suite uses
      # emojis (✔ ✗ ≈): with Python's UTF-8 mode every file harness stops
      # blowing up. Real Windows agents write in UTF-8, so this reflects
      # the app's behavior.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tests make REAL git commits (same reason as in test-linux).
      - name: Git identity
        run: |
          git config --global user.name "dedalo CI"
          git config --global user.email "ci@dedalo.local"

      # GitHub runners' PATH resolves `bash` to the WSL shim, which is not a
      # POSIX bash (it would spew "Windows Subsystem for Linux has no
      # installed distributions"). The git/gate/engine harnesses launch
      # chmod 755 scripts via `bash`, so the real Git Bash must be put
      # in front.
      - name: Real Git Bash on PATH
        shell: pwsh
        run: |
          $git = "C:\Program Files\Git"
          "PATH=$git\bin;$git\usr\bin;$env:PATH" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check dedalo/ tests/

      - name: Tests (headless pytest)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
          PYTHONFAULTHANDLER: 1
        run: python -m pytest tests/

  # The project registry stores Telegram/WhatsApp/Discord tokens in plain
  # text and the agents receive GITHUB_TOKEN: if something leaks into the
  # repo, it is cut off here. It also audits dependency CVEs.
  seguridad:
    name: secrets + dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # gitleaks reviews the WHOLE history, not the diff

      - name: Secrets in history (gitleaks)
        # On Dependabot PRs the token is read-only and gitleaks-action
        # blows up with "Resource not accessible by integration". Those PRs
        # only bump versions, they don't add secrets; the weekly push to
        # main does audit.
        if: github.actor != 'dependabot[bot]'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Lock is up to date with pyproject.toml
        # On Dependabot PRs the "Dependabot lock" workflow regenerates it;
        # here it would be skipped by a race. The push to main and the cron
        # do verify it.
        if: github.actor != 'dependabot[bot]'
        # It is regenerated in place (the header comment includes the exact
        # command) and only checked that git sees no differences.
        run: |
          uv pip compile --generate-hashes --extra dev --python-version 3.10 \
            -o requirements.lock pyproject.toml
          if ! git diff --quiet requirements.lock; then
            git diff requirements.lock
            echo "::error::requirements.lock out of date: retry with" \
              "'uv pip compile --generate-hashes --extra dev --python-version" \
              "3.10 -o requirements.lock pyproject.toml' and commit the lock"
            exit 1
          fi

      - name: Dependency audit (pip-audit on the lock)
        run: |
          # --strict: a new CVE breaks the build instead of being printed and
          # forgotten. Justified exceptions are noted with
          # --ignore-vuln-id. --no-deps: the lock already pins the whole set.
          pip install pip-audit
          pip-audit -r requirements.lock --no-deps --strict