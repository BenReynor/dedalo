name: Release

# Generates the release binaries when a v* tag is pushed.
#   git tag v2.1.0 && git push origin v2.1.0
# workflow_dispatch serves to test the pipeline without publishing (the
# release job only activates with a tag).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # Weekly (Monday 07:00 UTC): compiles the 3 OSes even if there are no
  # changes, to detect that a runner/PyInstaller/PySide6 update breaks the
  # packaging. The `release` job is limited to tags, so this does NOT publish.
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: write      # creates the release and uploads artifacts
  id-token: write      # OIDC token for the build provenance attestation
  attestations: write  # writes the signed provenance (attest-build-provenance)

jobs:
  linux:
    name: Linux (tar.gz + .deb + AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      # The binary boots Qt: besides the build libs, the runtime needs
      # GL/X/DBus (matches the .deb Depends).
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libglib2.0-0 dpkg-dev

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Package
        run: bash packaging/build_linux.sh

      - name: Checksums
        run: |
          cd packaging/out
          sha256sum *.tar.gz *.deb *.AppImage > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: |
            packaging/out/*.tar.gz
            packaging/out/*.deb
            packaging/out/*.AppImage
            packaging/out/SHA256SUMS
          if-no-files-found: error

  # Windows: the onedir (dedalo.exe) + .zip. The smoke validates the most
  # delicate part of the windowed binary: it boots the GUI and the engine via
  # `--dedalo-loop` runs packaged (its prints go to devnull, there is no
  # console) and returns its exit code.
  windows:
    name: Windows (.zip)
    runs-on: windows-latest
    # Runner console = cp1252: the engine smoke writes ✗/→ and without
    # UTF-8 the exe would blow up with UnicodeEncodeError (the code already
    # protects itself, this is the build's second barrier).
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Package (GUI smoke + engine)
        shell: bash
        run: bash packaging/build_windows.sh

      - name: Checksums
        shell: bash
        run: |
          cd packaging/out
          sha256sum *.zip > SHA256SUMS-windows
          cat SHA256SUMS-windows

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: |
            packaging/out/*.zip
            packaging/out/SHA256SUMS-windows
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [linux, windows]
    # Only when tagging a v*: workflow_dispatch publishes nothing.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # for --generate-notes

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      # Keyless build provenance: GitHub signs (Sigstore) that these exact bytes
      # were produced by this workflow/commit. No keys to manage. Verifiable by
      # anyone with `gh attestation verify <file> --repo BenReynor/dedalo`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --title "Dédalo $GITHUB_REF_NAME" \
            dist/*
