name: Release

# Generates the release binaries when a v* tag is pushed.
#   git tag v2.1.0 && git push origin v2.1.0
# workflow_dispatch serves to test the pipeline without publishing (the
# release job only activates with a tag).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # Weekly (Monday 07:00 UTC): compiles the 3 OSes even if there are no
  # changes, to detect that a runner/PyInstaller/PySide6 update breaks the
  # packaging. The `release` job is limited to tags, so this does NOT publish.
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: write      # creates the release and uploads artifacts
  id-token: write      # OIDC token for the build provenance attestation
  attestations: write  # writes the signed provenance (attest-build-provenance)

jobs:
  linux:
    name: Linux (tar.gz + .deb + AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      # The binary boots Qt: besides the build libs, the runtime needs
      # GL/X/DBus (matches the .deb Depends).
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libglib2.0-0 dpkg-dev

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Package
        run: bash packaging/build_linux.sh

      - name: Checksums
        run: |
          cd packaging/out
          sha256sum *.tar.gz *.deb *.AppImage > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            packaging/out/*.tar.gz
            packaging/out/*.deb
            packaging/out/*.AppImage
            packaging/out/SHA256SUMS
          if-no-files-found: error

  # Windows: the onedir (dedalo.exe) + .zip. The smoke validates the most
  # delicate part of the windowed binary: it boots the GUI and the engine via
  # `--dedalo-loop` runs packaged (its prints go to devnull, there is no
  # console) and returns its exit code.
  windows:
    name: Windows (.zip)
    runs-on: windows-latest
    # Runner console = cp1252: the engine smoke writes ✗/→ and without
    # UTF-8 the exe would blow up with UnicodeEncodeError (the code already
    # protects itself, this is the build's second barrier).
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Package (GUI smoke + engine)
        shell: bash
        run: bash packaging/build_windows.sh

      - name: Checksums
        shell: bash
        run: |
          cd packaging/out
          sha256sum *.zip > SHA256SUMS-windows
          cat SHA256SUMS-windows

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            packaging/out/*.zip
            packaging/out/SHA256SUMS-windows
          if-no-files-found: error

  macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    # Optional secrets: without them the .dmg ships unsigned (enough for
    # testing the pipeline). With them: codesign + notarytool + stapler.
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Package (smoke + signing + .dmg + notarization)
        run: bash packaging/build_macos.sh

      - name: Checksums
        run: |
          cd packaging/out
          shasum -a 256 *.dmg > SHA256SUMS-macos
          cat SHA256SUMS-macos

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: |
            packaging/out/*.dmg
            packaging/out/SHA256SUMS-macos
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [linux, macos, windows]
    # Only when tagging a v*: workflow_dispatch publishes nothing.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # for --generate-notes

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # Keyless build provenance: GitHub signs (Sigstore) that these exact bytes
      # were produced by this workflow/commit. No keys to manage. Verifiable by
      # anyone with `gh attestation verify <file> --repo BenReynor/dedalo`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --title "Dédalo $GITHUB_REF_NAME" \
            dist/*
