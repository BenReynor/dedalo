name: Dependabot lock

# When Dependabot bumps a version in pyproject.toml, requirements.lock goes
# out of sync and the CI "seguridad" job fails. Here the lock is regenerated
# in the PR's own branch so it is up to date.
#
# pull_request_target (not pull_request) because it needs a token with write
# permission; limited to Dependabot PRs with the `github.actor` guard.
on:
  pull_request_target:
    paths:
      - pyproject.toml
      - requirements.lock

permissions:
  contents: write

concurrency:
  group: dependabot-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  relock:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - uses: astral-sh/setup-uv@v7

      - name: Regenerate requirements.lock
        run: |
          uv pip compile --generate-hashes --extra dev --python-version 3.10 \
            -o requirements.lock pyproject.toml
          if git diff --quiet -- requirements.lock; then
            echo "requirements.lock is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add requirements.lock
          git commit -m "chore: regenerate requirements.lock"
          git push
