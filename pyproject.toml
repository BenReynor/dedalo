[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dedalo"
version = "2.1.0"
description = "Orchestrates AI agents to iterate on tasks, run tests, and commit automatically."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.11.0",
    "pyqtgraph>=0.13.7",
]

[project.optional-dependencies]
# `mcp` (stdio MCP server) is optional for the user, but it also goes into
# `dev` so CI has it and the tests in tests/test_mcp_server.py run (they
# do importorskip, so without it they just skip).
dev = [
    "pytest>=8",
    "ruff",
    "mcp>=2",
]
mcp = [
    "mcp>=2",
]

[tool.setuptools.packages.find]
include = ["dedalo*"]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.package-data]
# Must cover EXACTLY what plantillas.py copies at runtime. With
# `pip install -e .` the tests still pass, but with `pip install .` a file
# missing here causes FileNotFoundError when adding the first project.
# NOTE: the `*` globs do NOT match files starting with a dot, so .gitignore
# needs its own entry. Guarded by
# tests/test_plantillas.py::test_package_data_cubre_lo_que_instala.
dedalo = [
    "plantillas_data/*.sh",
    "plantillas_data/*.md",
    "plantillas_data/.gitignore",
    "plantillas_data/gate_checks/*.sh",
    "plantillas_data/gate_checks/*.py",
    "plantillas_data/plantillas/*/gate_checks/*.py",
    "plantillas_data/skills/ficha-dedalo/*.md",
    "icono.svg",
    "acceso.sh",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["dedalo/plantillas_data/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",          # long lines; the code uses ~88 but the label is descriptive
    "B008",          # mutable args in Qt selectors (PySide pattern)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"